<!DOCTYPE html>
<html lang="en-IN">

<head>

  <!-- =====================================================
       BASIC
  ====================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>Business | UBnux</title>


  <!-- =====================================================
       META DESCRIPTION
  ====================================================== -->

  <meta
    id="metaDescription"
    name="description"
    content="Discover local businesses on UBnux."
  >


  <!-- =====================================================
       CANONICAL
  ====================================================== -->

  <link
    id="canonicalLink"
    rel="canonical"
    href="https://ubnux.com/"
  >


  <!-- =====================================================
       ROBOTS
  ====================================================== -->

  <meta
    id="robotsMeta"
    name="robots"
    content="index,follow,max-image-preview:large"
  >


  <!-- =====================================================
       OPEN GRAPH
  ====================================================== -->

  <meta
    id="ogTitle"
    property="og:title"
    content="UBnux"
  >

  <meta
    id="ogDescription"
    property="og:description"
    content="Discover local businesses on UBnux."
  >

  <meta
    id="ogUrl"
    property="og:url"
    content="https://ubnux.com/"
  >

  <meta
    id="ogImage"
    property="og:image"
    content="https://ubnux.com/assets/images/default-business.jpg"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:site_name"
    content="UBnux"
  >


  <!-- =====================================================
       TWITTER
  ====================================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    id="twitterTitle"
    name="twitter:title"
    content="UBnux"
  >

  <meta
    id="twitterDescription"
    name="twitter:description"
    content="Discover local businesses on UBnux."
  >

  <meta
    id="twitterImage"
    name="twitter:image"
    content="https://ubnux.com/assets/images/default-business.jpg"
  >


  <!-- =====================================================
       CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="/assets/css/style.css"
  >

  <link
    rel="stylesheet"
    href="/assets/css/business.css"
  >


  <!-- =====================================================
       PRECONNECT
  ====================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

</head>


<body>


  <!-- =====================================================
       PAGE LOADER
  ====================================================== -->

  <div
    id="businessPageLoader"
    class="business-page-loader"
    aria-live="polite"
    aria-busy="true"
  >

    <div
      class="business-loader-spinner"
      aria-hidden="true"
    ></div>

    <p>
      Loading business...
    </p>

  </div>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="site-header">

    <div class="container">

      <a
        href="/"
        class="site-logo"
        aria-label="UBnux Home"
      >
        UBnux
      </a>

    </div>

  </header>


  <!-- =====================================================
       MAIN BUSINESS PAGE
  ====================================================== -->

  <main
    id="businessPage"
    class="business-page"
    hidden
  >

    <div class="container">


      <!-- =================================================
           BREADCRUMB
      ================================================== -->

      <nav
        id="businessBreadcrumb"
        class="breadcrumb"
        aria-label="Breadcrumb"
      >
      </nav>


      <!-- =================================================
           BUSINESS HERO
      ================================================== -->

      <section
        id="businessHero"
        class="business-hero"
      >


        <!-- ===============================================
             COVER
        ================================================ -->

        <div
          id="businessCover"
          class="business-cover"
        >
        </div>


        <!-- ===============================================
             MAIN BUSINESS INFORMATION
        ================================================ -->

        <div class="business-main-info">


          <!-- =============================================
               LOGO
          ============================================== -->

          <div
            id="businessLogo"
            class="business-logo-wrap"
          >
          </div>


          <!-- =============================================
               HEADING
          ============================================== -->

          <div class="business-heading">


            <!-- ===========================================
                 BADGES
            ============================================ -->

            <div
              id="businessBadges"
              class="business-badges"
            >
            </div>


            <!-- ===========================================
                 BUSINESS NAME
            ============================================ -->

            <h1
              id="businessName"
            >
              Business Name
            </h1>


            <!-- ===========================================
                 LOCATION
            ============================================ -->

            <p
              id="businessAddress"
              class="business-location"
            >
              Location
            </p>


            <!-- ===========================================
                 RATING
            ============================================ -->

            <div
              id="businessRating"
              class="business-rating"
            >
            </div>

          </div>

        </div>

      </section>


      <!-- =================================================
           CONTENT GRID
      ================================================== -->

      <div class="business-content-grid">


        <!-- ===============================================
             MAIN CONTENT
        ================================================ -->

        <article class="business-content">


          <!-- =============================================
               ABOUT BUSINESS
          ============================================== -->

          <section
            id="aboutBusinessSection"
            class="business-section"
          >

            <h2>
              About
              <span id="aboutBusinessName">
                this business
              </span>
            </h2>


            <div
              id="businessDescription"
              class="business-description"
            >
            </div>

          </section>


          <!-- =============================================
               ADDRESS
          ============================================== -->

          <section
            id="businessAddressSection"
            class="business-section"
          >

            <h2>
              Address &amp; Location
            </h2>


            <address
              id="businessFullAddress"
              class="business-address"
            >
            </address>

          </section>


          <!-- =============================================
               BUSINESS HOURS
          ============================================== -->

          <section
            id="businessHoursSection"
            class="business-section"
            hidden
          >

            <h2>
              Business Hours
            </h2>


            <div
              id="businessHours"
            >
            </div>


            <div
              id="businessWorkingDays"
              class="business-working-days"
            >
            </div>

          </section>


          <!-- =============================================
               RELATED BUSINESSES
          ============================================== -->

          <section
            id="relatedBusinessesSection"
            class="business-section"
            hidden
          >

            <h2>
              Related Businesses
            </h2>


            <div
              id="relatedBusinesses"
              class="related-business-grid"
            >
            </div>

          </section>


        </article>


        <!-- ===============================================
             SIDEBAR
        ================================================ -->

        <aside
          class="business-sidebar"
        >


          <!-- =============================================
               CONTACT CARD
          ============================================== -->

          <div
            class="business-contact-card"
          >

            <h2>
              Contact
            </h2>


            <div
              id="businessContactActions"
              class="business-contact-actions"
            >


              <!-- =========================================
                   CALL
              ========================================== -->

              <a
                id="callBusiness"
                class="contact-button"
                href="#"
                hidden
              >
                Call Business
              </a>


              <!-- =========================================
                   WHATSAPP
              ========================================== -->

              <a
                id="whatsappBusiness"
                class="contact-button"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                hidden
              >
                WhatsApp
              </a>


              <!-- =========================================
                   WEBSITE
              ========================================== -->

              <a
                id="websiteBusiness"
                class="contact-button"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                hidden
              >
                Visit Website
              </a>

            </div>

          </div>


          <!-- =============================================
               LOCATION CARD
          ============================================== -->

          <div
            class="business-location-card"
          >

            <h2>
              Location
            </h2>


            <p
              id="sidebarLocation"
            >
            </p>

          </div>


        </aside>

      </div>

    </div>

  </main>


  <!-- =====================================================
       ERROR
  ====================================================== -->

  <section
    id="businessPageError"
    class="business-error"
    hidden
  >

    <div class="container">

      <div class="business-error-inner">

        <div
          class="business-error-icon"
          aria-hidden="true"
        >
          🔎
        </div>


        <h1>
          Business Not Found
        </h1>


        <p>
          We could not find the business you are looking for.
        </p>


        <a
          href="/"
          class="business-error-button"
        >
          Go to UBnux
        </a>

      </div>

    </div>

  </section>


  <!-- =====================================================
       JAVASCRIPT
       
       IMPORTANT:
       Load order must remain:
       
       config
       api
       router
       meta
       schema
       business-page
  ====================================================== -->

  <script
    src="/assets/js/config.js"
  ></script>


  <script
    src="/assets/js/api.js"
  ></script>


  <script
    src="/assets/js/seo/seo-router.js"
  ></script>


  <script
    src="/assets/js/seo/seo-meta.js"
  ></script>


  <script
    src="/assets/js/seo/schema.js"
  ></script>


  <script
    src="/assets/js/seo/business-page.js"
  ></script>


</body>

</html>
