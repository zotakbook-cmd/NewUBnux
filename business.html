<!DOCTYPE html>
<html lang="en-IN">

<head>

  <!-- =====================================================
       BASIC
  ====================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="index,follow,max-image-preview:large"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >


  <!-- =====================================================
       TITLE
       business-page.js will replace this dynamically
  ====================================================== -->

  <title>
    Business | UBnux
  </title>


  <!-- =====================================================
       DESCRIPTION
  ====================================================== -->

  <meta
    name="description"
    content="Discover local businesses on UBnux."
  >


  <!-- =====================================================
       CANONICAL
       Initially generated from current browser URL.
       SEO module will update it with the final canonical.
  ====================================================== -->

  <link
    id="canonicalLink"
    rel="canonical"
    href=""
  >


  <!-- =====================================================
       OPEN GRAPH
  ====================================================== -->

  <meta
    property="og:type"
    content="business.business"
  >

  <meta
    property="og:title"
    content="Business | UBnux"
  >

  <meta
    property="og:description"
    content="Discover local businesses on UBnux."
  >

  <meta
    property="og:url"
    content=""
  >

  <meta
    property="og:image"
    content=""
  >


  <!-- =====================================================
       TWITTER
  ====================================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Business | UBnux"
  >

  <meta
    name="twitter:description"
    content="Discover local businesses on UBnux."
  >

  <meta
    name="twitter:image"
    content=""
  >


  <!-- =====================================================
       CANONICAL BOOTSTRAP
  ====================================================== -->

  <script>

    (function () {

      "use strict";


      try {

        var link =
          document.getElementById(
            "canonicalLink"
          );


        if (!link) {

          return;

        }


        var pathname =
          window.location.pathname ||
          "/";


        /*
         * Keep the public SEO URL.
         */

        if (
          pathname !== "/" &&
          !pathname.endsWith("/")
        ) {

          pathname += "/";

        }


        link.href =
          window.location.origin +
          pathname;


      } catch (error) {

        console.warn(
          "UBnux canonical bootstrap failed:",
          error
        );

      }

    })();

  </script>


  <!-- =====================================================
       CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="/assets/css/style.css"
  >

  <link
    rel="stylesheet"
    href="/assets/css/business.css"
  >


</head>


<body>


  <!-- =====================================================
       PAGE LOADER
  ====================================================== -->

  <div
    id="businessPageLoader"
    class="business-page-loader"
    aria-live="polite"
    aria-busy="true"
  >

    <div class="business-loader-inner">

      <div
        class="business-loader-spinner"
        aria-hidden="true"
      ></div>

      <p>
        Loading business...
      </p>

    </div>

  </div>


  <!-- =====================================================
       BUSINESS PAGE
  ====================================================== -->

 <!-- =====================================================
     BUSINESS PAGE
====================================================== -->

<main
  id="businessPage"
  class="business-page"
  hidden
>

  <!-- ===================================================
       BUSINESS PAGE CONTENT

       IMPORTANT:
       business-page.js expects:
       #businessPageContent
  ==================================================== -->

  <div
    id="businessPageContent"
    class="business-page-content"
  >

    <div class="container">

      <!-- =================================================
           BREADCRUMB
      ================================================== -->

      <nav
        id="businessBreadcrumb"
        class="breadcrumb"
        aria-label="Breadcrumb"
      ></nav>


      <!-- =================================================
           HERO
      ================================================== -->

      <section
        id="businessHero"
        class="business-hero"
      >

        <!-- ===============================================
             COVER
        ================================================ -->

        <div
          id="businessCover"
          class="business-cover"
        ></div>


        <!-- ===============================================
             MAIN INFO
        ================================================ -->

        <div class="business-main-info">

          <!-- =============================================
               LOGO
          ============================================== -->

          <div
            id="businessLogo"
            class="business-logo-wrap"
          ></div>


          <!-- =============================================
               HEADING
          ============================================== -->

          <div class="business-heading">

            <!-- BADGES -->

            <div
              id="businessBadges"
              class="business-badges"
            ></div>


            <!-- BUSINESS NAME -->

            <h1 id="businessName">
              Business
            </h1>


            <!-- LOCATION -->

            <p
              id="businessAddress"
              class="business-location"
            ></p>


            <!-- RATING -->

            <div
              id="businessRating"
              class="business-rating"
            ></div>

          </div>

        </div>

      </section>


      <!-- =================================================
           CONTENT GRID
      ================================================== -->

      <div class="business-content-grid">

        <!-- ===============================================
             MAIN CONTENT
        ================================================ -->

        <article class="business-content">

          <!-- =============================================
               ABOUT
          ============================================== -->

          <section
            id="aboutBusinessSection"
            class="business-section"
          >

            <h2>

              About

              <span id="aboutBusinessName">
                this business
              </span>

            </h2>


            <div
              id="businessDescription"
              class="business-description"
            ></div>

          </section>


          <!-- =============================================
               ADDRESS
          ============================================== -->

          <section
            id="businessAddressSection"
            class="business-section"
            hidden
          >

            <h2>
              Address &amp; Location
            </h2>


            <address
              id="businessFullAddress"
              class="business-address"
            ></address>

          </section>


          <!-- =============================================
               BUSINESS HOURS
          ============================================== -->

          <section
            id="businessHoursSection"
            class="business-section"
            hidden
          >

            <h2>
              Business Hours
            </h2>


            <div
              id="businessHours"
            ></div>


            <div
              id="businessWorkingDays"
              class="business-working-days"
            ></div>

          </section>


          <!-- =============================================
               RELATED BUSINESSES
          ============================================== -->

          <section
            id="relatedBusinessesSection"
            class="business-section"
            hidden
          >

            <h2>
              Related Businesses
            </h2>


            <div
              id="relatedBusinesses"
              class="related-business-grid"
            ></div>

          </section>

        </article>


        <!-- ===============================================
             SIDEBAR
        ================================================ -->

        <aside class="business-sidebar">

          <!-- =============================================
               CONTACT
          ============================================== -->

          <div
            id="businessContactActions"
            class="business-contact-actions"
          >

            <!-- CALL -->

            <a
              id="callBusiness"
              class="contact-button"
              href="#"
              hidden
            >
              Call Business
            </a>


            <!-- WHATSAPP -->

            <a
              id="whatsappBusiness"
              class="contact-button"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              hidden
            >
              WhatsApp
            </a>


            <!-- WEBSITE -->

            <a
              id="websiteBusiness"
              class="contact-button"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              hidden
            >
              Visit Website
            </a>

          </div>


          <!-- =============================================
               LOCATION
          ============================================== -->

          <div
            class="business-location-card"
          >

            <h2>
              Location
            </h2>


            <p
              id="sidebarLocation"
            ></p>

          </div>

        </aside>

      </div>

    </div>

  </div>

</main>

  <!-- =====================================================
       ERROR
  ====================================================== -->

  <section
    id="businessPageError"
    class="business-error"
    hidden
  >

    <div class="container">

      <div class="business-error-inner">

        <div
          class="business-error-icon"
          aria-hidden="true"
        >
          🔎
        </div>


        <h1>
          Business Not Found
        </h1>


        <p id="businessErrorMessage">
          We could not find the business you are looking for.
        </p>


        <a
          href="/"
          class="business-error-button"
        >
          Go to UBnux
        </a>

      </div>

    </div>

  </section>


  <!-- =====================================================
       JAVASCRIPT
       -----------------------------------------------------
       IMPORTANT:
       Do not load app.js here.
       Business pages must remain independent from
       the listing application.
  ====================================================== -->

<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/seo/seo-router.js"></script>
<script src="/assets/js/seo/seo-meta.js"></script>
<script src="/assets/js/seo/schema.js"></script>
<script src="/assets/js/seo/business-page.js"></script>


</body>

</html>
