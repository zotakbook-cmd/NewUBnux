<!DOCTYPE html>
<html lang="en-IN">

<head>

  <!-- =====================================================
       BASIC META
  ====================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Business | UBnux</title>

  <meta
    name="description"
    content="Find business details, services, contact information, location and more on UBnux."
  >

  <meta
    name="robots"
    content="index,follow,max-image-preview:large"
  >

  <!-- =====================================================
       CANONICAL
  ====================================================== -->

  <link
    rel="canonical"
    href="https://ubnux.com/"
    id="canonicalURL"
  >

  <!-- =====================================================
       OPEN GRAPH
  ====================================================== -->

  <meta
    property="og:type"
    content="website"
    id="ogType"
  >

  <meta
    property="og:title"
    content="Business | UBnux"
    id="ogTitle"
  >

  <meta
    property="og:description"
    content="Find business details, services, contact information, location and more on UBnux."
    id="ogDescription"
  >

  <meta
    property="og:url"
    content="https://ubnux.com/"
    id="ogURL"
  >

  <meta
    property="og:image"
    content="https://ubnux.com/assets/images/default-business.jpg"
    id="ogImage"
  >

  <meta
    property="og:site_name"
    content="UBnux"
  >

  <!-- =====================================================
       TWITTER
  ====================================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Business | UBnux"
    id="twitterTitle"
  >

  <meta
    name="twitter:description"
    content="Find business details, services, contact information, location and more on UBnux."
    id="twitterDescription"
  >

  <meta
    name="twitter:image"
    content="https://ubnux.com/assets/images/default-business.jpg"
    id="twitterImage"
  >

  <!-- =====================================================
       FAVICON
  ====================================================== -->

  <link
    rel="icon"
    href="/assets/images/favicon.ico"
  >

  <!-- =====================================================
       MAIN SITE CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="/assets/css/style.css"
  >

  <!-- =====================================================
       BUSINESS PAGE CSS
       Category Templates
  ====================================================== -->

  <link
    rel="stylesheet"
    href="/assets/css/business.css"
  >

  <!-- =====================================================
       OPTIONAL PAGE META / STRUCTURED DATA
  ====================================================== -->

  <meta
    name="theme-color"
    content="#111827"
  >

</head>


<body>

  <!-- =====================================================
       SITE HEADER
  ====================================================== -->

  <header
    id="siteHeader"
    class="site-header"
  >

    <!--
      If your main header is injected dynamically,
      this container will be used by the existing
      UBnux header system.
    -->

    <div id="headerContainer"></div>

  </header>


  <!-- =====================================================
       BUSINESS PAGE
  ====================================================== -->

  <main
    id="businessPage"
    class="business-page"
    hidden
  >

    <!-- ===================================================
         BUSINESS PAGE CONTENT
         Template will render here
    ==================================================== -->

    <div
      id="businessPageContent"
      class="business-page-content"
    ></div>


    <!-- ===================================================
         ERROR STATE
    ==================================================== -->

    <section
      id="businessPageError"
      class="business-error"
      hidden
    >

      <div class="business-error-inner">

        <div class="business-error-icon">
          !
        </div>

        <h1>
          Business Not Found
        </h1>

        <p id="businessErrorMessage">
          We could not find the business you are looking for.
        </p>

        <a
          href="/"
          class="business-error-home"
        >
          Go to UBnux Home
        </a>

      </div>

    </section>


    <!-- ===================================================
         LOADING STATE
    ==================================================== -->

    <div
      id="businessPageLoader"
      class="business-page-loader"
      hidden
    >

      <div class="business-loader-inner">

        <div class="business-loader-spinner"></div>

        <p>
          Loading business...
        </p>

      </div>

    </div>

  </main>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer
    id="siteFooter"
    class="site-footer"
  >

    <div id="footerContainer"></div>

  </footer>


  <!-- =====================================================
       CORE JAVASCRIPT
  ====================================================== -->

  <script src="/assets/js/config.js"></script>

  <script src="/assets/js/api.js"></script>


  <!-- =====================================================
       SEO ROUTER
  ====================================================== -->

  <script src="/assets/js/seo/seo-router.js"></script>

  <script src="/assets/js/seo/seo-meta.js"></script>

  <script src="/assets/js/seo/schema.js"></script>


  <!-- =====================================================
       BUSINESS TEMPLATE SYSTEM
  ====================================================== -->

  <!-- Template Utilities -->

  <script
    src="/assets/js/seo/business/template-utils.js"
  ></script>


  <!-- Template Registry -->

  <script
    src="/assets/js/seo/business/template-registry.js"
  ></script>


  <!-- =====================================================
       BUSINESS CATEGORY TEMPLATES
  ====================================================== -->

  <!-- Default -->

  <script
    src="/assets/js/seo/business/templates/default-template.js"
  ></script>


  <!-- Restaurant -->

  <script
    src="/assets/js/seo/business/templates/restaurant-template.js"
  ></script>


  <!-- Clothing & Fashion -->

  <script
    src="/assets/js/seo/business/templates/clothing-template.js"
  ></script>


  <!-- Hotel -->

  <script
    src="/assets/js/seo/business/templates/hotel-template.js"
  ></script>


  <!-- Salon -->

  <script
    src="/assets/js/seo/business/templates/salon-template.js"
  ></script>


  <!-- Hospital -->

  <script
    src="/assets/js/seo/business/templates/hospital-template.js"
  ></script>


  <!-- Coaching -->

  <script
    src="/assets/js/seo/business/templates/coaching-template.js"
  ></script>


  <!-- Real Estate -->

  <script
    src="/assets/js/seo/business/templates/realestate-template.js"
  ></script>


  <!-- Automobile -->

  <script
    src="/assets/js/seo/business/templates/automobile-template.js"
  ></script>


  <!-- Electronics -->

  <script
    src="/assets/js/seo/business/templates/electronics-template.js"
  ></script>


  <!-- Grocery -->

  <script
    src="/assets/js/seo/business/templates/grocery-template.js"
  ></script>


  <!-- Services -->

  <script
    src="/assets/js/seo/business/templates/service-template.js"
  ></script>


  <!-- =====================================================
       BUSINESS PAGE CONTROLLER
       MUST BE LAST
  ====================================================== -->

  <script
    src="/assets/js/seo/business-page.js"
  ></script>


</body>

</html>
