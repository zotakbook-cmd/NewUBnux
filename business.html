
<html lang="en-IN">

<head>

  <!-- =====================================================
       BASIC META
  ====================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Business | UBnux</title>

  <meta
    name="description"
    content="Find business details, services, contact information, location and more on UBnux."
  >

  <meta
    name="robots"
    content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"
  >

  <!-- =====================================================
       CANONICAL
       seo-meta.js will replace this dynamically
  ====================================================== -->

  <link
    rel="canonical"
    href="https://ubnux.com/"
    id="canonicalURL"
  >

  <!-- =====================================================
       OPEN GRAPH
  ====================================================== -->

  <meta
    property="og:type"
    content="website"
    id="ogType"
  >

  <meta
    property="og:title"
    content="Business | UBnux"
    id="ogTitle"
  >

  <meta
    property="og:description"
    content="Find business details, services, contact information, location and more on UBnux."
    id="ogDescription"
  >

  <meta
    property="og:url"
    content="https://ubnux.com/"
    id="ogURL"
  >

  <meta
    property="og:image"
    content="https://ubnux.com/assets/images/default-business.jpg"
    id="ogImage"
  >

  <meta
    property="og:site_name"
    content="UBnux"
  >

  <meta
    property="og:locale"
    content="en_IN"
  >

  <!-- =====================================================
       TWITTER
  ====================================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Business | UBnux"
    id="twitterTitle"
  >

  <meta
    name="twitter:description"
    content="Find business details, services, contact information, location and more on UBnux."
    id="twitterDescription"
  >

  <meta
    name="twitter:image"
    content="https://ubnux.com/assets/images/default-business.jpg"
    id="twitterImage"
  >

  <!-- =====================================================
       FAVICON
  ====================================================== -->

  <link
    rel="icon"
    href="/assets/images/favicon.ico"
  >

  <!-- =====================================================
       MAIN SITE CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="/assets/css/style.css?v=3.0.0"
  >

  <!-- =====================================================
       BUSINESS TEMPLATE CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="/assets/css/business.css?v=2.1.0"
  >

  <!-- =====================================================
       THEME
  ====================================================== -->

  <meta
    name="theme-color"
    content="#111827"
  >

  <!-- =====================================================
       BUSINESS PAGE BASE CSS
       Keeps the shell independent from homepage layout.
  ====================================================== -->

  <style id="ubnux-business-page-base-style">

    html{
      width:100%;
      min-height:100%;
    }

    body{
      width:100%;
      min-height:100vh;
      margin:0;
      padding:0;
    }

    /*
     * Business controller turns this page into an
     * independent document-flow surface.
     */
    body.ubnux-business-page-active{
      display:block !important;
      width:100% !important;
      min-height:100vh !important;
      height:auto !important;
      margin:0 !important;
      padding:0 !important;
      overflow-x:hidden !important;
    }

    #businessPageRoot{
      display:block;
      position:relative;
      width:100%;
      min-height:100vh;
      height:auto;
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    #businessPageRoot[hidden]{
      display:none !important;
    }

    #businessPageContent{
      display:block;
      position:relative;
      width:100%;
      min-height:1px;
      height:auto;
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    #businessPageContent:empty{
      min-height:0;
    }

    #businessPageLoader[hidden],
    #businessPageError[hidden]{
      display:none !important;
    }

  </style>

</head>


<body>

  <!-- =====================================================
       BUSINESS PAGE ROOT
       IMPORTANT:
       This structure matches business-page.js v11.2+
       ====================================================== -->

  <div
    id="businessPageRoot"
    class="business-page-root"
    hidden
    aria-live="polite"
  >

    <!-- ===================================================
         LOADING STATE
    ==================================================== -->

    <div
      id="businessPageLoader"
      class="business-page-loader"
      hidden
      aria-live="polite"
      aria-busy="true"
    >

      <div class="ubnux-business-loader-inner business-loader-inner">

        <div
          class="ubnux-business-loader-spinner business-loader-spinner"
          aria-hidden="true"
        ></div>

        <p>
          Loading business...
        </p>

      </div>

    </div>


    <!-- ===================================================
         ERROR STATE
    ==================================================== -->

    <section
      id="businessPageError"
      class="business-error"
      hidden
      role="alert"
    >

      <div class="business-error-inner">

        <div
          class="business-error-icon"
          aria-hidden="true"
        >
          !
        </div>

        <h1>
          Business Not Found
        </h1>

        <p id="businessErrorMessage">
          We could not find the business you are looking for.
        </p>

        <a
          href="/"
          class="business-error-home"
        >
          Go to UBnux Home
        </a>

      </div>

    </section>


    <!-- ===================================================
         BUSINESS TEMPLATE MOUNT

         Keep this as a neutral DIV.
         The controller replaces/normalizes it if necessary.
    ==================================================== -->

    <div
      id="businessPageContent"
      class="ubnux-business-mount business-page-content"
      aria-live="polite"
    ></div>

  </div>


  <!-- =====================================================
       CORE JAVASCRIPT
  ====================================================== -->

  <script src="/assets/js/config.js?v=3.0.1"></script>
  <script src="/assets/js/api.js?v=3.0.0"></script>

  <script src="/assets/js/seo/seo-router.js?v=2.2.0"></script>
  <script src="/assets/js/seo/seo-meta.js?v=3.1.0"></script>
  <script src="/assets/js/seo/schema.js?v=2.1.0"></script>

  <script src="/assets/js/seo/business-page.js?v=11.2.0"></script>

</body>

</html>
