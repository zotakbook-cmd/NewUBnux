<!DOCTYPE html>
<html lang="en-IN">

<head>

  <!-- =====================================================
       BASIC META
  ====================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Business | UBnux</title>

  <meta
    name="description"
    content="Find business details, services, contact information, location and more on UBnux."
  >

  <meta
    name="robots"
    content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"
  >


  <!-- =====================================================
       CANONICAL
       seo-meta.js / business-page.js will update this
  ====================================================== -->

  <link
    rel="canonical"
    href="https://ubnux.com/"
    id="canonicalURL"
  >


  <!-- =====================================================
       OPEN GRAPH
  ====================================================== -->

  <meta
    property="og:type"
    content="website"
    id="ogType"
  >

  <meta
    property="og:title"
    content="Business | UBnux"
    id="ogTitle"
  >

  <meta
    property="og:description"
    content="Find business details, services, contact information, location and more on UBnux."
    id="ogDescription"
  >

  <meta
    property="og:url"
    content="https://ubnux.com/"
    id="ogURL"
  >

  <meta
    property="og:image"
    content="https://ubnux.com/assets/images/default-business.jpg"
    id="ogImage"
  >

  <meta
    property="og:site_name"
    content="UBnux"
  >

  <meta
    property="og:locale"
    content="en_IN"
  >


  <!-- =====================================================
       TWITTER
  ====================================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Business | UBnux"
    id="twitterTitle"
  >

  <meta
    name="twitter:description"
    content="Find business details, services, contact information, location and more on UBnux."
    id="twitterDescription"
  >

  <meta
    name="twitter:image"
    content="https://ubnux.com/assets/images/default-business.jpg"
    id="twitterImage"
  >


  <!-- =====================================================
       FAVICON
  ====================================================== -->

  <link
    rel="icon"
    href="/assets/images/favicon.ico"
  >


  <!-- =====================================================
       MAIN SITE CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="/assets/css/style.css?v=3.0.1"
  >


  <!-- =====================================================
       BUSINESS PAGE CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="/assets/css/business.css?v=2.1.0"
  >


  <!-- =====================================================
       THEME
  ====================================================== -->

  <meta
    name="theme-color"
    content="#111827"
  >


  <!-- =====================================================
       BUSINESS PAGE BASE
  ====================================================== -->

  <style id="ubnux-business-page-base-style">

    *,
    *::before,
    *::after{
      box-sizing:border-box;
    }


    html{
      width:100%;
      min-height:100%;
      margin:0;
      padding:0;
    }


    body{
      width:100%;
      min-width:0;
      min-height:100vh;
      margin:0;
      padding:0;
      overflow-x:hidden;
    }


    /*
     * Business page must remain independent
     * from homepage flex/grid layout.
     */

    body.ubnux-business-page-active{
      display:block !important;
      width:100% !important;
      min-width:0 !important;
      min-height:100vh !important;
      height:auto !important;
      margin:0 !important;
      padding:0 !important;
      overflow-x:hidden !important;
      overflow-y:auto !important;
    }


    /*
     * Main business page wrapper
     */

    #businessPageRoot{
      display:block;
      position:relative;
      width:100%;
      max-width:100%;
      min-width:0;
      min-height:100vh;
      height:auto;
      margin:0;
      padding:0;
      box-sizing:border-box;
      overflow:visible;
    }


    #businessPageRoot[hidden]{
      display:none !important;
    }


    /*
     * Loading state
     */

    #businessPageLoader{
      width:100%;
      min-height:240px;
    }


    #businessPageLoader[hidden]{
      display:none !important;
    }


    /*
     * Error state
     */

    #businessPageError{
      width:100%;
      min-height:50vh;
    }


    #businessPageError[hidden]{
      display:none !important;
    }


    /*
     * Template mount
     */

    #businessPageContent{
      display:block;
      position:relative;
      width:100%;
      max-width:100%;
      min-width:0;
      min-height:1px;
      height:auto;
      margin:0;
      padding:0;
      box-sizing:border-box;
      overflow:visible;
    }


    #businessPageContent:empty{
      min-height:0;
    }


    /*
     * Prevent template content from creating
     * accidental horizontal page overflow.
     */

    #businessPageContent img,
    #businessPageContent video,
    #businessPageContent iframe{
      max-width:100%;
    }


    #businessPageContent table{
      max-width:100%;
    }

  </style>

</head>


<body>

  <!-- =====================================================
       BUSINESS PAGE ROOT
  ====================================================== -->

  <div
    id="businessPageRoot"
    class="business-page-root"
    hidden
    aria-live="polite"
  >


    <!-- ===================================================
         LOADING
    ==================================================== -->

    <div
      id="businessPageLoader"
      class="business-page-loader"
      hidden
      aria-live="polite"
      aria-busy="true"
    >

      <div
        class="ubnux-business-loader-inner business-loader-inner"
      >

        <div
          class="ubnux-business-loader-spinner business-loader-spinner"
          aria-hidden="true"
        ></div>

        <p>
          Loading business...
        </p>

      </div>

    </div>


    <!-- ===================================================
         ERROR
    ==================================================== -->

    <section
      id="businessPageError"
      class="business-error"
      hidden
      role="alert"
    >

      <div class="business-error-inner">

        <div
          class="business-error-icon"
          aria-hidden="true"
        >
          !
        </div>

        <h1>
          Business Not Found
        </h1>

        <p id="businessErrorMessage">
          We could not find the business you are looking for.
        </p>

        <a
          href="/"
          class="business-error-home"
        >
          Go to UBnux Home
        </a>

      </div>

    </section>


    <!-- ===================================================
         BUSINESS TEMPLATE MOUNT

         business-page.js injects the selected
         BusinessTemplate here.
    ==================================================== -->

    <main
      id="businessPageContent"
      class="ubnux-business-mount business-page-content"
      aria-live="polite"
    ></main>

  </div>


  <!-- =====================================================
       CORE CONFIG
  ====================================================== -->

  <script src="/assets/js/config.js?v=3.0.1"></script>


  <!-- =====================================================
       API
       Must load before business-page.js
  ====================================================== -->

  <script src="/assets/js/api.js?v=3.0.0"></script>


  <!-- =====================================================
       SEO ROUTER
  ====================================================== -->

  <script src="/assets/js/seo/seo-router.js?v=2.2.0"></script>


  <!-- =====================================================
       SEO META
  ====================================================== -->

  <script src="/assets/js/seo/seo-meta.js?v=3.1.0"></script>


  <!-- =====================================================
       JSON-LD / SCHEMA
  ====================================================== -->

  <script src="/assets/js/seo/schema.js?v=2.1.0"></script>


  <!-- =====================================================
       BUSINESS PAGE CONTROLLER
       IMPORTANT: current fixed version
  ====================================================== -->

  <script src="/assets/js/seo/business-page.js?v=11.3.0"></script>

</body>

</html>
